# Linkprüfung — wöchentlich auf der gesamten Site, optional auch bei PRs.
# Öffnet ein Issue, wenn tote Links gefunden werden.

name: Linkcheck

on:
  schedule:
    - cron: '0 6 * * 1'        # jeden Montag, 06:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 './build/site/**/*.html'
          fail: false
          output: ./lychee-out.md

      - name: Create issue from result
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Linkcheck: Bericht vom ${{ github.run_id }}"
          content-filepath: ./lychee-out.md
          labels: linkcheck, automated
